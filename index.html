<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kutu Dünyası Online - Titremesiz Hareket</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    overflow: hidden;
    background: #0a1f0a;
    font-family: Arial, sans-serif;
    touch-action: none;
    height: 100vh;
  }

  #menu {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eee;
    z-index: 200;
  }

  input, select, button {
    width: 260px;
    padding: 14px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
  }

  button {
    background: #2e7d32;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  #camera {
    position: absolute;
    inset: 0;
    pointer-events: none;
    will-change: transform;
  }

  #game {
    position: absolute;
    width: 3000px;
    height: 3000px;
    background: #228B22;
    background-image:
      radial-gradient(circle at 15% 85%, #32CD32 1.2px, transparent 1.2px),
      radial-gradient(circle at 75% 25%, #7CFC00 0.9px, transparent 0.9px),
      radial-gradient(circle at 40% 60%, #90EE90 1px, transparent 1px);
    background-size: 70px 70px, 100px 100px, 120px 120px;
  }

  .player {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 5px solid #ffffff;
    box-shadow: 0 0 16px rgba(255,255,255,0.7), inset 0 0 10px rgba(0,0,0,0.4);
    background: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: white;
    text-shadow: 2px 2px 4px black;
    z-index: 10;
    transform: translate3d(0, 0, 0);
    -webkit-transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    perspective: 1000;
    -webkit-perspective: 1000;
  }

  .name {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 3px black;
    white-space: nowrap;
    background: rgba(0,0,0,0.5);
    padding: 2px 8px;
    border-radius: 12px;
    z-index: 11;
  }

  .bubble {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    color: #111;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    white-space: nowrap;
    max-width: 240px;
    z-index: 12;
    margin-bottom: 35px; /* İsim ile arasına boşluk */
    opacity: 1;
    transition: opacity 0.5s ease-in-out;
    pointer-events: none;
  }

  .bubble.fade-out {
    opacity: 0;
  }

  #roomUI {
    position: fixed;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.65);
    color: lime;
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: bold;
    z-index: 100;
  }

  #chatIcon {
    position: fixed;
    bottom: 140px;
    right: 20px;
    width: 52px;
    height: 52px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    color: white;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 60;
  }

  #chatPanel {
    position: fixed;
    bottom: 200px;
    right: 10px;
    width: 300px;
    height: 380px;
    background: rgba(0,0,0,0.9);
    border-radius: 14px;
    display: none;
    flex-direction: column;
    z-index: 70;
    border: 1px solid #444;
  }

  #chatMessages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    color: #ddd;
  }

  #chatInput {
    padding: 12px;
    background: #1a1a1a;
    color: white;
    border: none;
    font-size: 15px;
  }

  #joyBase {
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 110px;
    height: 110px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    z-index: 50;
    backdrop-filter: blur(4px);
    border: 2px solid rgba(255,255,255,0.3);
  }

  #joyStick {
    position: absolute;
    width: 54px;
    height: 54px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    left: 28px;
    top: 28px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    transition: transform 0.02s linear;
    will-change: transform;
    border: 2px solid rgba(255,255,255,0.8);
  }

  #minimap {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 110px;
    height: 110px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #555;
    border-radius: 10px;
    z-index: 40;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Kutu Dünyası</h1>
  <input id="name" placeholder="İsmin" value="Oyuncu">
  <select id="color">
    <option value="#e74c3c">Kırmızı</option>
    <option value="#3498db">Mavi</option>
    <option value="#2ecc71">Yeşil</option>
    <option value="#f1c40f">Sarı</option>
    <option value="#9b59b6">Mor</option>
    <option value="#e67e22">Turuncu</option>
  </select>
  <button onclick="hostGame()">Oda Aç</button>
  <input id="roomToJoin" placeholder="Oda Kodu">
  <button onclick="joinGame()">Katıl</button>
</div>

<div id="roomUI" style="display:none;">Oda: <span id="roomID"></span></div>
<div id="chatIcon" onclick="toggleChat()">💬</div>

<div id="chatPanel">
  <div id="chatMessages"></div>
  <input id="chatInput" placeholder="Mesaj yaz... (Enter)" onkeypress="if(event.key==='Enter') sendChatMessage()">
</div>

<div id="camera">
  <div id="game"></div>
</div>

<canvas id="minimap" width="110" height="110"></canvas>

<div id="joyBase">
  <div id="joyStick"></div>
</div>

<script>
(function() {
  const MAP_SIZE = 3000;
  let peer = null;
  let connections = [];
  let players = {};
  let myId = "";
  
  let myData = { 
    x: MAP_SIZE/2, 
    y: MAP_SIZE/2, 
    name: "", 
    color: "#e74c3c", 
    msg: "" 
  };

  let inputDir = { x: 0, y: 0 };
  const MOVE_SPEED = 3.8;
  
  const gameDiv = document.getElementById("game");
  const cameraDiv = document.getElementById("camera");
  const mini = document.getElementById("minimap");
  const miniCtx = mini.getContext("2d");
  const chatBox = document.getElementById("chatMessages");

  let lastUpdateTime = 0;
  let rafId = null;

  function createPlayer(id, data) {
    let el = document.createElement("div");
    el.className = "player";
    el.id = "p" + id;
    
    // İsim ve baloncuk ayrı elementler
    let nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.textContent = data.name || "?";
    
    let bubbleEl = document.createElement("div");
    bubbleEl.className = "bubble";
    bubbleEl.textContent = data.msg || "";
    
    el.appendChild(nameEl);
    el.appendChild(bubbleEl);
    
    el.style.left = data.x + "px";
    el.style.top = data.y + "px";
    el.style.background = data.color;
    el.style.transform = "translate3d(0,0,0)";
    
    gameDiv.appendChild(el);
    
    players[id] = {
      element: el,
      nameEl: nameEl,
      bubbleEl: bubbleEl,
      x: data.x,
      y: data.y,
      msg: data.msg || "",
      msgTimeout: null
    };
  }

  function updatePlayer(id, data) {
    let player = players[id];
    if (!player) return;
    
    player.x = data.x;
    player.y = data.y;
    player.element.style.background = data.color;
    
    if (player.nameEl) {
      player.nameEl.textContent = data.name || "?";
    }

    // Mesaj varsa göster ve 4 saniye sonra solup kaybol
    if (data.msg && data.msg !== player.msg) {
      player.msg = data.msg;
      
      if (player.bubbleEl) {
        // Yeni mesajı göster
        player.bubbleEl.textContent = data.msg;
        player.bubbleEl.style.opacity = "1";
        player.bubbleEl.classList.remove("fade-out");
        
        // Önceki timeout'u temizle
        if (player.msgTimeout) {
          clearTimeout(player.msgTimeout);
        }
        
        // 4 saniye sonra solmaya başla
        player.msgTimeout = setTimeout(() => {
          if (player.bubbleEl) {
            player.bubbleEl.classList.add("fade-out");
            
            // 0.5 saniye sonra tamamen gizle (transition süresi kadar)
            setTimeout(() => {
              if (player.bubbleEl) {
                player.bubbleEl.style.opacity = "0";
                player.msg = "";
              }
            }, 500);
          }
        }, 3500); // 3.5 saniye bekle + 0.5 saniye solma = 4 saniye
      }
    }
  }

  function renderAll() {
    for (let id in players) {
      let player = players[id];
      if (!player || !player.element) continue;
      
      player.element.style.left = player.x + "px";
      player.element.style.top = player.y + "px";
    }
    
    drawMinimap();
  }

  function sendPosition() {
    if (!myId) return;
    
    let payload = {
      id: myId,
      x: myData.x,
      y: myData.y,
      name: myData.name,
      color: myData.color,
      msg: myData.msg || ""
    };

    connections.forEach(c => { if (c && c.open) c.send(payload); });
  }

  function handleData(data) {
    if (!players[data.id]) {
      createPlayer(data.id, data);
    } else {
      updatePlayer(data.id, data);
    }

    if (data.msg && data.id !== myId) {
      let div = document.createElement("div");
      div.textContent = `${data.name || "?"}: ${data.msg}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  }

  function gameLoop(currentTime) {
    if (!lastUpdateTime) {
      lastUpdateTime = currentTime;
      rafId = requestAnimationFrame(gameLoop);
      return;
    }

    const deltaTime = Math.min(32, currentTime - lastUpdateTime);
    lastUpdateTime = currentTime;
    
    if (inputDir.x !== 0 || inputDir.y !== 0) {
      const moveX = inputDir.x * MOVE_SPEED * (deltaTime / 16);
      const moveY = inputDir.y * MOVE_SPEED * (deltaTime / 16);
      
      myData.x += moveX;
      myData.y += moveY;
      
      myData.x = Math.max(27, Math.min(MAP_SIZE-27, myData.x));
      myData.y = Math.max(27, Math.min(MAP_SIZE-27, myData.y));
    }
    
    if (players[myId]) {
      players[myId].x = myData.x;
      players[myId].y = myData.y;
    }
    
    renderAll();
    updateCamera();
    
    rafId = requestAnimationFrame(gameLoop);
  }

  function updateCamera() {
    let wx = window.innerWidth / 2;
    let wy = window.innerHeight / 2;

    let tx = -myData.x + wx;
    let ty = -myData.y + wy;

    tx = Math.max(window.innerWidth - MAP_SIZE, Math.min(0, tx));
    ty = Math.max(window.innerHeight - MAP_SIZE, Math.min(0, ty));

    cameraDiv.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
  }

  // Joystick
  const joyBase = document.getElementById("joyBase");
  const joyStick = document.getElementById("joyStick");
  let joystickActive = false;

  joyBase.addEventListener("touchstart", (e) => {
    e.preventDefault();
    joystickActive = true;
    updateJoystick(e.touches[0]);
  }, { passive: false });

  joyBase.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (joystickActive) {
      updateJoystick(e.touches[0]);
    }
  }, { passive: false });

  joyBase.addEventListener("touchend", (e) => {
    e.preventDefault();
    joystickActive = false;
    resetJoystick();
  }, { passive: false });

  joyBase.addEventListener("touchcancel", (e) => {
    e.preventDefault();
    joystickActive = false;
    resetJoystick();
  }, { passive: false });

  function updateJoystick(touch) {
    let r = joyBase.getBoundingClientRect();
    let cx = r.left + 55;
    let cy = r.top + 55;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    let dist = Math.hypot(dx, dy);
    let maxDist = 48;
    
    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }
    
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    
    if (dist > 8) {
      inputDir.x = dx / maxDist;
      inputDir.y = dy / maxDist;
      
      const len = Math.hypot(inputDir.x, inputDir.y);
      if (len > 1) {
        inputDir.x /= len;
        inputDir.y /= len;
      }
    } else {
      inputDir.x = 0;
      inputDir.y = 0;
    }
  }

  function resetJoystick() {
    joyStick.style.transform = "translate(0,0)";
    inputDir.x = 0;
    inputDir.y = 0;
  }

  // Klavye
  const keys = {};

  window.addEventListener("keydown", (e) => {
    if (document.activeElement.tagName === "INPUT") return;
    
    const key = e.key.toLowerCase();
    keys[key] = true;
    
    if (key.startsWith("arrow")) {
      e.preventDefault();
    }
    
    updateKeyboardInput();
  });

  window.addEventListener("keyup", (e) => {
    if (document.activeElement.tagName === "INPUT") return;
    
    const key = e.key.toLowerCase();
    keys[key] = false;
    
    if (key.startsWith("arrow")) {
      e.preventDefault();
    }
    
    updateKeyboardInput();
  });

  function updateKeyboardInput() {
    if (joystickActive) return;
    
    let kx = 0;
    let ky = 0;
    
    if (keys["d"] || keys["arrowright"]) kx += 1;
    if (keys["a"] || keys["arrowleft"]) kx -= 1;
    if (keys["s"] || keys["arrowdown"]) ky += 1;
    if (keys["w"] || keys["arrowup"]) ky -= 1;
    
    if (kx !== 0 || ky !== 0) {
      const len = Math.hypot(kx, ky);
      inputDir.x = kx / len;
      inputDir.y = ky / len;
    } else {
      inputDir.x = 0;
      inputDir.y = 0;
    }
  }

  // Chat
  function toggleChat() {
    let p = document.getElementById("chatPanel");
    p.style.display = p.style.display === "flex" ? "none" : "flex";
    if (p.style.display === "flex") {
      document.getElementById("chatInput").focus();
    }
  }

  function sendChatMessage() {
    let input = document.getElementById("chatInput");
    let text = input.value.trim();
    if (!text) return;
    
    // Kendi mesajımı göster
    myData.msg = text;
    
    // Kendi baloncuğumu güncelle
    if (players[myId]) {
      let player = players[myId];
      player.msg = text;
      
      if (player.bubbleEl) {
        player.bubbleEl.textContent = text;
        player.bubbleEl.style.opacity = "1";
        player.bubbleEl.classList.remove("fade-out");
        
        if (player.msgTimeout) {
          clearTimeout(player.msgTimeout);
        }
        
        player.msgTimeout = setTimeout(() => {
          if (player.bubbleEl) {
            player.bubbleEl.classList.add("fade-out");
            
            setTimeout(() => {
              if (player.bubbleEl) {
                player.bubbleEl.style.opacity = "0";
                player.msg = "";
                myData.msg = ""; // myData'yı da temizle
              }
            }, 500);
          }
        }, 3500);
      }
    }

    // Chat'e ekle
    let div = document.createElement("div");
    div.textContent = `${myData.name}: ${text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;

    input.value = "";
  }

  // Minimap
  function drawMinimap() {
    miniCtx.fillStyle = "#0a1a0a";
    miniCtx.fillRect(0, 0, 110, 110);

    for (let id in players) {
      let player = players[id];
      if (!player) continue;
      
      let x = (player.x / MAP_SIZE) * 110;
      let y = (player.y / MAP_SIZE) * 110;
      
      miniCtx.fillStyle = id === myId ? "#00ff41" : "#aaa";
      miniCtx.fillRect(Math.round(x-2), Math.round(y-2), 5, 5);
    }
  }

  // Oyun başlatma
  function hostGame() {
    peer = new Peer();
    peer.on("open", id => {
      myId = id;
      document.getElementById("roomID").textContent = id;
      document.getElementById("roomUI").style.display = "block";
      startGame();
    });
    peer.on("connection", conn => {
      connections.push(conn);
      conn.on("data", handleData);
    });
  }

  function joinGame() {
    let code = document.getElementById("roomToJoin").value.trim();
    if (!code) return alert("Oda kodu girin");
    
    peer = new Peer();
    peer.on("open", myPeerId => {
      myId = myPeerId;
      let conn = peer.connect(code);
      connections = [conn];
      conn.on("open", () => {
        document.getElementById("roomID").textContent = code;
        document.getElementById("roomUI").style.display = "block";
        startGame();
      });
      conn.on("data", handleData);
    });
  }

  function startGame() {
    document.getElementById("menu").style.display = "none";
    myData.name = document.getElementById("name").value.trim() || "Oyuncu";
    myData.color = document.getElementById("color").value;
    
    myData.x = MAP_SIZE/2;
    myData.y = MAP_SIZE/2;
    
    createPlayer(myId, myData);
    
    setInterval(sendPosition, 50);
    
    if (rafId) {
      cancelAnimationFrame(rafId);
    }
    lastUpdateTime = 0;
    rafId = requestAnimationFrame(gameLoop);
  }

  // Global fonksiyonlar
  window.hostGame = hostGame;
  window.joinGame = joinGame;
  window.toggleChat = toggleChat;
  window.sendChatMessage = sendChatMessage;

  window.addEventListener("resize", updateCamera);
  
  window.addEventListener("load", () => {
    if (!document.getElementById("name").value) {
      document.getElementById("name").value = "Oyuncu" + Math.floor(Math.random() * 1000);
    }
  });

  window.addEventListener("blur", () => {
    Object.keys(keys).forEach(key => keys[key] = false);
    if (!joystickActive) {
      inputDir.x = 0;
      inputDir.y = 0;
    }
  });

})();
</script>
</body>
</html>
