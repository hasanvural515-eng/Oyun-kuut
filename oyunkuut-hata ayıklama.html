<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kutu Dünyası - FULL FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  /* GÖNDERDİĞİN DOSYADAKİ TÜM TASARIMLARI AYNEN KORUDUM */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0a1f0a; font-family:Arial, sans-serif; touch-action:none; height:100vh; }
  #menu { position: fixed; inset: 0; background: #1a7a0a; display: flex; z-index: 1000; }
  #sidebar { width: 70px; background: #0d3d05; border-right: 3px solid #000; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
  .nav-icon { font-size: 30px; margin-bottom: 30px; cursor: pointer; filter: grayscale(1); }
  #main-content { flex: 1; display: flex; flex-direction: column; }
  #server-list { flex: 1; padding: 20px; overflow-y: auto; }
  .server-card { background: #ff0000; border: 3px solid #000; border-radius: 10px; padding: 15px; margin-bottom: 12px; color: white; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
  .server-card.selected { border-color: #fff; box-shadow: 0 0 15px #fff; transform: scale(1.02); background: #cc0000; }
  .server-card.permanent { border: 4px solid #ffd700; }
  #bottom-bar { height: 100px; display: flex; border-top: 3px solid #000; }
  .bottom-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; cursor: pointer; }
  #btn-host { background: #22dd22; border-right: 3px solid #000; }
  #btn-join { background: #ffaa00; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1100; align-items: center; justify-content: center; }
  .modal-box { background: #1a7a0a; border: 4px solid #000; padding: 20px; width: 320px; color: white; border-radius:15px; }
  .modal-box input, .modal-box select { width: 100%; padding: 10px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #fff; }
  #camera { position:absolute; inset:0; pointer-events:none; will-change:transform; }
  #game { position:absolute; width:3000px; height:3000px; background:#228B22; background-image:radial-gradient(circle at 10% 20%, #32CD32 2px, transparent 2px); background-size:80px 80px; }
  .player { position:absolute; width:60px; height:60px; border-radius:50%; border:4px solid white; box-shadow:0 0 20px rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; font-size:30px; color:white; z-index:10; }
  .name { position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:12px; color:white; font-weight:bold; background:rgba(0,0,0,0.7); padding:2px 8px; border-radius:12px; border:1px solid #4caf50; }
  .health-bar { position:absolute; bottom:-15px; left:50%; transform:translateX(-50%); width:50px; height:6px; background:rgba(0,0,0,0.7); border-radius:3px; border:1px solid white; }
  .health-fill { height:100%; width:100%; background:#4caf50; }
  .bubble { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:white; color:black; padding:4px 10px; border-radius:12px; font-size:12px; margin-bottom:35px; opacity:0; transition:opacity 0.3s; z-index:12; border:2px solid #4caf50; }
  .bubble.show { opacity:1; }
  .bullet { position:absolute; border-radius:50%; z-index:9; }
  #roomUI { position:fixed; top:10px; left:10px; background:rgba(0,0,0,0.8); color:#4caf50; padding:6px 12px; border-radius:20px; z-index:100; border:2px solid #4caf50; font-size:14px; display:none; }
  #playerCount { position:fixed; top:10px; right:120px; background:rgba(0,0,0,0.8); color:white; padding:6px 12px; border-radius:20px; z-index:100; border:2px solid #555; }
  #killFeed { position:fixed; top:50px; right:10px; background:rgba(0,0,0,0.8); color:white; padding:6px; border-radius:8px; z-index:100; border:2px solid #ff4444; max-width:200px; font-size:11px; }
  #fireButton { position:fixed; bottom:20px; right:20px; width:80px; height:80px; background:rgba(255,0,0,0.8); border-radius:50%; border:4px solid white; color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:102; font-size:30px; }
  #moveJoystick { position:fixed; bottom:20px; left:20px; width:100px; height:100px; z-index:50; }
  .joyBase { width:80px; height:80px; background:rgba(255,255,255,0.15); border-radius:50%; position:absolute; bottom:0; }
  .joyStick { position:absolute; width:40px; height:40px; background:white; border-radius:50%; left:20px; top:20px; border:2px solid #4caf50; }
  #minimap { position:fixed; top:10px; right:10px; width:100px; height:100px; background:rgba(0,0,0,0.9); border:3px solid #4caf50; border-radius:12px; z-index:40; }
  #chatIcon { position:fixed; bottom:120px; right:20px; width:40px; height:40px; background:rgba(0,0,0,0.7); border-radius:50%; color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:60; border:2px solid #4caf50; }
  #chatPanel { position:fixed; bottom:170px; right:10px; width:220px; height:300px; background:rgba(20,20,20,0.95); border-radius:15px; display:none; flex-direction:column; z-index:70; border:2px solid #4caf50; }
  #chatMessages { flex:1; padding:8px; overflow-y:auto; color:white; font-size:12px; }
  #chatInput { padding:8px; background:#1a1a1a; color:white; border:none; border-top:1px solid #4caf50; border-radius:0 0 15px 15px; }
</style>
</head>
<body>

<div id="menu">
  <div id="sidebar">
    <div class="nav-icon" style="filter:none">🌐</div>
    <div class="nav-icon">👤</div>
  </div>
  <div id="main-content">
    <div id="server-list">
      <div class="server-card permanent" onclick="selectServer('kutu-dunyasi-ana', this)">
        <div><h2>ANA SUNUCU#1 (7/24)</h2><small>Giriş Serbest</small></div>
        <div>👤 <span id="mainPlayerCount">0</span>/100</div>
      </div>
      <div id="dynamic-rooms"></div>
    </div>
    <div id="bottom-bar">
      <div id="btn-host" class="bottom-btn" onclick="openHostModal()">ODA KUR</div>
      <div id="btn-join" class="bottom-btn" onclick="joinSelectedServer()">KATIL</div>
    </div>
  </div>
</div>

<div id="hostModal" class="modal">
  <div class="modal-box">
    <h3 style="text-align:center">ODA AYARLARI</h3>
    <input type="text" id="srvName" placeholder="Sunucu İsmi..." maxlength="20">
    <input type="password" id="srvPass" placeholder="Şifre (Opsiyonel)">
    <select id="srvMax">
      <option value="2">2 Kişi</option>
      <option value="5" selected>5 Kişi</option>
      <option value="10">10 Kişi</option>
    </select>
    <button onclick="startHosting()" style="background:#22dd22; color:#000; font-weight:bold;">DÜNYAYA ATIL</button>
    <button onclick="closeModals()" style="background:red">İPTAL</button>
  </div>
</div>

<input type="hidden" id="roomToJoin">
<div id="roomUI">📌 Oda: <span id="roomID"></span></div>
<div id="playerCount">0</div>
<div id="killFeed"></div>
<div id="fireButton" ontouchstart="fire()" onmousedown="fire()">🔫</div>
<div id="chatIcon" onclick="toggleChat()">💬</div>
<div id="chatPanel"><div id="chatMessages"></div><input id="chatInput" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') sendMessage()"></div>

<div id="camera"><div id="game"></div></div>
<canvas id="minimap" width="100" height="100"></canvas>
<div id="moveJoystick"><div class="joyBase"><div class="joyStick" id="moveStick"></div></div></div>

<script>
// ========== AYIKLANMIŞ VE HATALARI GİDERİLMİŞ JAVASCRIPT ==========
const MAP_SIZE = 3000;
let peer = null, connections = [], players = {}, bullets = {}, bulletCounter = 0;
let myId = null, moveActive = false, moveInput = {x:0, y:0}, lastMoveDir = {x:1, y:0};
let lastFireTime = 0, selectedID = null;

let myData = {
  x: MAP_SIZE/2, y: MAP_SIZE/2,
  name: "Oyuncu_" + Math.floor(Math.random()*999),
  color: "#"+Math.floor(Math.random()*16777215).toString(16),
  health: 100, kills: 0, deaths: 0, dir: {x:1, y:0}, msg: ""
};

const gameDiv = document.getElementById("game");
const cameraDiv = document.getElementById("camera");
const miniCanvas = document.getElementById("minimap");
const miniCtx = miniCanvas.getContext("2d");

// --- MENÜ VE BAĞLANTI SİSTEMİ ---
function selectServer(id, element) {
    document.querySelectorAll('.server-card').forEach(c => c.classList.remove('selected'));
    element.classList.add('selected');
    selectedID = id;
}

function openHostModal() { document.getElementById('hostModal').style.display = 'flex'; }
function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

function startHosting() {
    myData.serverName = document.getElementById("srvName").value || "Adsız Oda";
    closeModals();
    hostGame();
}

function joinSelectedServer() {
    if (!selectedID) return alert("Lütfen bir sunucu seçin!");
    document.getElementById("roomToJoin").value = selectedID;
    joinGame();
}

function enterWorld(id) {
    document.getElementById("menu").style.display = "none";
    document.getElementById("roomUI").style.display = "block";
    document.getElementById("roomID").textContent = id;
    
    createPlayer(myId, myData);
    setInterval(sendMyData, 50);
    requestAnimationFrame(gameLoop);
}

// --- PEERJS FONKSİYONLARI (TEKİLLEŞTİRİLDİ) ---
function hostGame() {
    if (peer) peer.destroy();
    peer = new Peer();
    peer.on('open', (id) => { myId = id; enterWorld(id); });
    peer.on('connection', setupConnection);
}

function joinGame() {
    let code = document.getElementById("roomToJoin").value.trim();
    if (peer) peer.destroy();
    peer = new Peer();
    peer.on('open', (id) => {
        myId = id;
        let conn = peer.connect(code);
        setupConnection(conn);
        enterWorld(code);
    });
}

function setupConnection(conn) {
    conn.on('open', () => {
        connections.push(conn);
        conn.send({ type: "player", id: myId, ...myData });
    });
    conn.on('data', (data) => {
        if (data.type === "bullet") createBullet(data.x, data.y, data.targetX, data.targetY, data.shooterId);
        else if (data.type === "hit") handleHit(data);
        else updatePlayer(data.id, data);
    });
}

// --- OYUN MEKANİKLERİ ---
function createPlayer(id, data) {
    if (document.getElementById("p"+id)) return;
    let el = document.createElement("div");
    el.className = "player"; el.id = "p"+id;
    el.style.background = data.color;
    el.innerHTML = `<div class="name">${data.name}</div><div class="health-bar"><div class="health-fill" id="h${id}"></div></div><div class="bubble" id="b${id}"></div>`;
    gameDiv.appendChild(el);
    players[id] = { el, x: data.x, y: data.y, health: 100, name: data.name, dir: {x:1, y:0} };
}

function updatePlayer(id, data) {
    if (!players[id]) return createPlayer(id, data);
    let p = players[id];
    p.x = data.x; p.y = data.y; p.dir = data.dir || {x:1, y:0};
    p.el.style.left = p.x + "px"; p.el.style.top = p.y + "px";
    document.getElementById("h"+id).style.width = data.health + "%";
    if (data.msg) showBubble(id, data.msg);
}

function showBubble(id, text) {
    let b = document.getElementById("b"+id);
    if (b) { b.textContent = text; b.classList.add("show"); setTimeout(() => b.classList.remove("show"), 3000); }
}

function fire() {
    if (Date.now() - lastFireTime < 300) return;
    lastFireTime = Date.now();
    let tx = myData.x + lastMoveDir.x * 700, ty = myData.y + lastMoveDir.y * 700;
    createBullet(myData.x, myData.y, tx, ty, myId);
    connections.forEach(c => c.send({ type: "bullet", x: myData.x, y: myData.y, targetX: tx, targetY: ty, shooterId: myId }));
}

function createBullet(x, y, tx, ty, sid) {
    let bid = "b" + bulletCounter++;
    let el = document.createElement("div"); el.className = "bullet"; el.id = bid;
    el.style.width = "8px"; el.style.height = "8px"; el.style.background = "yellow";
    gameDiv.appendChild(el);
    let dist = Math.hypot(tx-x, ty-y);
    bullets[bid] = { el, x, y, vx: ((tx-x)/dist)*12, vy: ((ty-y)/dist)*12, sid, dist: 0 };
}

function handleHit(data) {
    if (data.targetId === myId) {
        myData.health -= 35;
        if (myData.health <= 0) {
            myData.health = 100; myData.x = 1500; myData.y = 1500;
            addKillMsg(players[data.shooterId]?.name || "Bilinmeyen", myData.name);
        }
    }
}

function addKillMsg(k, v) {
    let d = document.createElement("div"); d.textContent = `💀 ${k} ➔ ${v}`;
    document.getElementById("killFeed").appendChild(d); setTimeout(() => d.remove(), 3000);
}

function sendMyData() {
    connections.forEach(c => { if(c.open) c.send({ type: "player", id: myId, ...myData, dir: lastMoveDir }); });
}

function gameLoop() {
    if (moveActive) {
        myData.x = Math.max(0, Math.min(MAP_SIZE, myData.x + moveInput.x * 5));
        myData.y = Math.max(0, Math.min(MAP_SIZE, myData.y + moveInput.y * 5));
        players[myId].el.style.left = myData.x + "px"; players[myId].el.style.top = myData.y + "px";
    }
    for (let id in bullets) {
        let b = bullets[id]; b.x += b.vx; b.y += b.vy; b.dist += 12;
        b.el.style.left = b.x + "px"; b.el.style.top = b.y + "px";
        if (b.dist > 700) { b.el.remove(); delete bullets[id]; }
        else {
            for (let pid in players) {
                if (pid !== b.sid && Math.hypot(b.x - players[pid].x, b.y - players[pid].y) < 30) {
                    if (pid === myId) handleHit({targetId: myId, shooterId: b.sid});
                    b.el.remove(); delete bullets[id]; break;
                }
            }
        }
    }
    cameraDiv.style.transform = `translate(${window.innerWidth/2 - myData.x}px, ${window.innerHeight/2 - myData.y}px)`;
    drawMinimap();
    requestAnimationFrame(gameLoop);
}

function drawMinimap() {
    miniCtx.clearRect(0,0,100,100); miniCtx.fillStyle = "rgba(0,40,0,0.8)"; miniCtx.fillRect(0,0,100,100);
    for (let id in players) {
        miniCtx.fillStyle = (id === myId) ? "#00ff00" : "#ff0000";
        miniCtx.beginPath(); miniCtx.arc((players[id].x/MAP_SIZE)*100, (players[id].y/MAP_SIZE)*100, 3, 0, Math.PI*2); miniCtx.fill();
    }
}

// --- JOYSTICK VE CHAT ---
const ms = document.getElementById("moveStick");
document.getElementById("moveJoystick").addEventListener("touchstart", (e) => { e.preventDefault(); moveActive = true; });
document.getElementById("moveJoystick").addEventListener("touchmove", (e) => {
    e.preventDefault(); let r = ms.parentElement.getBoundingClientRect();
    let dx = e.touches[0].clientX - (r.left + 40), dy = e.touches[0].clientY - (r.top + 40);
    let d = Math.hypot(dx, dy); if (d > 30) { dx *= 30/d; dy *= 30/d; }
    ms.style.transform = `translate(${dx}px, ${dy}px)`;
    moveInput = { x: dx/30, y: dy/30 }; if (d > 5) lastMoveDir = { x: dx/d, y: dy/d };
});
document.getElementById("moveJoystick").addEventListener("touchend", () => { moveActive = false; ms.style.transform = "translate(0,0)"; moveInput = {x:0, y:0}; });

function toggleChat() { let p = document.getElementById("chatPanel"); p.style.display = p.style.display === "flex" ? "none" : "flex"; }
function sendMessage() {
    let i = document.getElementById("chatInput"); if (!i.value) return;
    myData.msg = i.value; showBubble(myId, i.value);
    let d = document.createElement("div"); d.innerHTML = `<b>Sen:</b> ${i.value}`;
    document.getElementById("chatMessages").appendChild(d); i.value = "";
    setTimeout(() => myData.msg = "", 2000);
}
</script>
</body>
</html>
